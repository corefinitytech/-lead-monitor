name: lead-monitor

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 min (GitHub may delay a few minutes). Use "*/30 * * * *" for a private repo.
  workflow_dispatch: {}       # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: lead-monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py
      - name: Save seen posts
        run: |
          git config user.name "lead-monitor"
          git config user.email "lead-monitor@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "update seen" && git push)
